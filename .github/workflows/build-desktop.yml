name: Build desktop clients

# Builds the real installers on GitHub's own Windows / macOS machines.
# Run it from the Actions tab, or push a tag like v1.0.0 to publish a release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write

jobs:
  windows:
    name: Windows (.exe installer + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Type-check and test
        shell: bash
        run: |
          set -o pipefail
          { npm run typecheck && npm run selftest && npm run lantest && npm run test:update; } 2>&1 | tee test.log

      - name: Explain the test failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          # Annotations are readable through the API even when the job log is not.
          tail -c 1500 test.log 2>/dev/null | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-900 > msg.txt || true
          echo "::error title=test-log::$(cat msg.txt)"

      - name: Build the game
        shell: bash
        run: |
          set -o pipefail
          npm run build:desktop 2>&1 | tee build.log

      - name: Package Windows app
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish never 2>&1 | tee -a build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: TankGame-windows
          path: release/desktop/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: TankGame-portable-html
          path: release/TankGame-*-portable.html

  macos:
    name: macOS (dmg, Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Type-check and test
        shell: bash
        run: |
          set -o pipefail
          { npm run typecheck && npm run test:update; } 2>&1 | tee test.log

      - name: Explain the test failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          # Annotations are readable through the API even when the job log is not.
          tail -c 1500 test.log 2>/dev/null | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-900 > msg.txt || true
          echo "::error title=test-log::$(cat msg.txt)"

      - name: Build the game
        shell: bash
        run: |
          set -o pipefail
          npm run build:desktop 2>&1 | tee build.log

      - name: Package macOS app
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --mac --publish never 2>&1 | tee -a build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: TankGame-macos
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
          if-no-files-found: error

      - name: Report failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci-diagnostics
          { echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo "job: macos"; tail -c 20000 build.log 2>/dev/null || echo "no build.log"; } > ci-mac-failure.txt
          git add -f ci-mac-failure.txt
          git commit -m "mac build failure log" || true
          git push -f origin ci-diagnostics

  release:
    name: Attach builds to a release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          generate_release_notes: true

  manifest:
    name: Refresh updates.json
    # The app reads its release list from a CDN mirror, so the manifest has to be
    # in the repo (and on the release) the moment the assets land.
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate updates.json from the published releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-update-manifest.mjs

      - name: Commit it back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- updates.json; then
            echo "manifest unchanged"
          else
            git add updates.json
            git commit -m "chore: refresh updates.json for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi

      - name: Attach the manifest to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" updates.json --clobber
