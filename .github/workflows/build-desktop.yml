name: Build desktop clients

# Builds the real installers on GitHub's own Windows / macOS machines.
# Run it from the Actions tab, or push a tag like v1.0.0 to publish a release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write

jobs:
  windows:
    name: Windows (.exe installer + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Type-check and test
        shell: bash
        run: |
          npm run typecheck
          npm run selftest
          npm run lantest

      - name: Build the game
        shell: bash
        run: |
          set -o pipefail
          npm run build:desktop 2>&1 | tee build.log

      - name: Package Windows app
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish never 2>&1 | tee -a build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: TankGame-windows
          path: release/desktop/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: TankGame-portable-html
          path: release/*.html

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) { log = 'no build.log'; }
            const tail = log.slice(-2500);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || 2,
              body: 'WINDOWS BUILD FAILED\n```\n' + tail + '\n```',
            });

  macos:
    name: macOS (dmg, Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Build the game
        shell: bash
        run: |
          set -o pipefail
          npm run build:desktop 2>&1 | tee build.log

      - name: Package macOS app
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --mac --publish never 2>&1 | tee -a build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: TankGame-macos
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
          if-no-files-found: error

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) { log = 'no build.log'; }
            const tail = log.slice(-2500);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || 2,
              body: 'MAC BUILD FAILED\n```\n' + tail + '\n```',
            });

  release:
    name: Attach builds to a release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          generate_release_notes: true
